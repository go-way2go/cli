name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: [go-mod, stable]
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go != 'go-mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go-mod' && 'go.mod' || '' }}
      - name: go version
        run: go version
      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: no framework dependencies
        shell: bash
        run: |
          if go list -deps ./... | grep -E 'github\.com/go-way2go/(gui|framework)(/|$)'; then exit 1; fi
